[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epilearn"
dynamic = ["version"]
description = "A Pytorch library for machine learning in epidemic modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emory-Melody", email = "zevin.liu@gmail.com" }]
maintainers = [{ name = "Emory-Melody", email = "zevin.liu@gmail.com" }]
keywords = ["epidemic modeling", "time series", "forecasting", "nowcasting", "graph neural networks"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]

# Verified by import-blocking each candidate: these are the modules that a bare
# `import epilearn` (plus the benchmark CLI) actually needs.
dependencies = [
    "torch>=1.13",
    "torch_geometric>=2.3",
    "numpy>=1.24",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "networkx>=2.8",
    "scikit-learn>=1.1",
    "statsmodels>=0.14",
    "optuna>=3.0",
    "psutil>=5.9",
    "tqdm>=4.64",
    "einops>=0.6",
    "fastdtw>=0.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Foundation-model backends, one extra per backend. Each is imported lazily
# inside its model's _load_model(), so the package works without them -- the
# benchmark reports such models as skipped and direct use raises ImportError
# with a pip hint.
#
# They deliberately are NOT combined into a single "foundation" extra: their
# own pins are mutually exclusive (momentfm requires numpy==1.25.2 while
# timesfm requires numpy>=1.26.4), so asking for all four at once can never
# resolve. Install the one you need, and use a separate environment per
# backend if you need more than one. All four require Python >= 3.10.
chronos = ["chronos-forecasting"]
moirai = ["uni2ts"]
moment = ["momentfm"]
timesfm = ["timesfm"]
# Interactive plotting used by Forecast.plot_preds(interactive=True).
plot = ["plotly>=5.0"]

[project.urls]
Homepage = "https://github.com/Emory-Melody/EpiLearn"
Documentation = "https://epilearn-doc.readthedocs.io/en/latest/"
Paper = "https://arxiv.org/abs/2406.06016"
Issues = "https://github.com/Emory-Melody/EpiLearn/issues"

[project.scripts]
epilearn-benchmark = "epilearn.benchmark:main"

[tool.setuptools]
# NOTE: a bare `epilearn*` glob would also match a stray `epilearn_old/`
# directory, so the two patterns are spelled out.
packages = { find = { include = ["epilearn", "epilearn.*"] } }

[tool.setuptools.dynamic]
version = { attr = "epilearn.__version__" }
