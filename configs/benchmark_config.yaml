# =============================================================================
# EpiLearn Forecasting Benchmark Configuration
# =============================================================================
# Usage: python -m epilearn.benchmark --config configs/benchmark_config.yaml
#
# NOTE on Optuna parameter sampling:
#   - 1 value  → fixed (no tuning)
#   - 2 values → treated as [min, max] RANGE (suggest_int or suggest_float)
#   - 3+ values → treated as CATEGORICAL choices
#   Use 3+ values when you want specific discrete choices (e.g., n_heads).

task: forecast

# -----------------------------------------------------------------------------
# Dataset Configuration
# -----------------------------------------------------------------------------
dataset:
  feature_path: "./datasets/toy_features.csv"
  graph_path: "./datasets/toy_edges.csv"
  # toy_edges.csv is an unweighted "source,target" edge list; add
  # graph_weight_col: "<column>" if you point graph_path at a weighted one.
  timestamp_col: "time"
  region_col: "node"
  feature_cols: ["f1", "f2", "f3", "y"]  # f0 removed: was identical to target y
  target_cols: ["y"]

  transforms:
    normalize_features: false
    normalize_target: false
    normalize_graph: true

# -----------------------------------------------------------------------------
# Evaluation Settings (Rolling Train)
# -----------------------------------------------------------------------------
evaluation:
  lookback: 53           # Max lookback (individual models may tune smaller values)
  horizon: 4             # 4-week forecast horizon
  train_size: 104        # 2 years — captures full annual seasonality
  val_size: 52           # 1 year — full seasonal cycle for HP tuning / conformal calibration
  test_size: 104         # 2 years — evaluation across diverse epidemic phases
  step_size: 52          # 1-year advancement — yields 7 folds, covers full time series
  max_folds: null

  # Optuna hyperparameter tuning
  use_optuna: true
  n_trials: 15

  # Training
  patience: 15
  conformal_alpha: 0.1
  verbose: false
  seed: 42               # Global random seed for reproducibility

# -----------------------------------------------------------------------------
# Parallel Execution
# -----------------------------------------------------------------------------
parallel:
  enable: true
  gpu_ids: null           # null = auto-detect, or [0, 1, 2, 3] for specific GPUs
  workers_per_gpu: 2      # Conservative to prevent OOM with foundation models

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output:
  save_path: "./benchmark_results/forecast/"

# -----------------------------------------------------------------------------
# Models to Benchmark
# -----------------------------------------------------------------------------

models:
  # =========================================================================
  # TEMPORAL MODELS (Neural Networks - No graph required)
  # =========================================================================

  # -------------------------------------------------------------------------
  # Channel-Dependent Models (process all channels/features together)
  # -------------------------------------------------------------------------

  - name: iTransformerModel
    requires_graph: true  # Channel-dependent: needs 4D input (batch, time, nodes, features)
    optuna_model_args:
      d_model: [32, 64, 128]
      n_heads: [2, 4, 8]       # 3 values → categorical (avoids invalid divisibility)
      e_layers: [1, 2, 3]
      dropout: [0.1, 0.3]      # 2 values → float range [0.1, 0.3]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]      # 2 values → log-scale float range
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: TSMixerModel
    requires_graph: true  # Channel-dependent: needs 4D input (batch, time, nodes, features)
    optuna_model_args:
      d_model: [32, 64, 128]
      e_layers: [1, 2, 3]
      dropout: [0.1, 0.3]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: FreTSModel
    requires_graph: true  # Channel-dependent: needs 4D input (batch, time, nodes, features)
    optuna_model_args:
      embed_size: [64, 128, 256]
      hidden_size: [128, 256, 512]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  # -------------------------------------------------------------------------
  # Standard Temporal Models
  # -------------------------------------------------------------------------

  - name: GRUModel
    requires_graph: false
    optuna_model_args:
      nhids: [32, 64, 128]
      dropout: [0.1, 0.5]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: LSTMModel
    requires_graph: false
    optuna_model_args:
      nhid: [32, 64, 128]
      dropout: [0.1, 0.5]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: CNNModel
    requires_graph: false
    optuna_model_args:
      conv1_hid: [8, 16, 32]
      conv2_hid: [16, 32, 64]
      linear_hid: [64, 128]
      dropout: [0.3, 0.5]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: MLPModel
    requires_graph: false
    optuna_model_args:
      nhids: [32, 64, 128]
      dropout: [0.1, 0.5]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: DlinearModel
    requires_graph: false
    optuna_model_args:
      moving_avg_window: [7, 15, 25]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: PatchTSTModel
    requires_graph: false
    optuna_model_args:
      d_model: [32, 48, 64]        # All divisible by 2, 4, and 8
      n_heads: [2, 4, 8]           # 3 values → categorical (avoid n_heads=3 from range)
      n_layers: [1, 2, 3]          # 3 values → categorical
      patch_len: [4, 8]            # FIXED: removed 16 to ensure patch_len < min(lookback)=8
      lookback: [16, 32, 48]       # FIXED: removed 8 to ensure sufficient patches (min 2x patch_len)
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  # =========================================================================
  # SKLEARN MODELS (Traditional ML - No optimizer params needed)
  # =========================================================================

  - name: LinearRegressionModel
    requires_graph: false
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: RidgeModel
    requires_graph: false
    optuna_model_args:
      alpha: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: LassoModel
    requires_graph: false
    optuna_model_args:
      alpha: [0.01, 0.1, 1.0]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: ElasticNetModel
    requires_graph: false
    optuna_model_args:
      alpha: [0.01, 0.1, 1.0]
      l1_ratio: [0.2, 0.5, 0.8]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: RandomForestModel
    requires_graph: false
    optuna_model_args:
      n_estimators: [50, 100, 200]
      max_depth: [5, 10, 20]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: GradientBoostingModel
    requires_graph: false
    optuna_model_args:
      n_estimators: [50, 100, 200]
      max_depth: [3, 5, 7]
      learning_rate: [0.01, 0.05, 0.1]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  # - name: SVRModel
  #   requires_graph: false
  #   optuna_model_args:
  #     C: [0.1, 1.0, 10.0]
  #     kernel: ['rbf', 'linear']
  #     lookback: [8, 16, 32, 48]
  #   optimizer_params: {}

  - name: KNNModel
    requires_graph: false
    optuna_model_args:
      n_neighbors: [3, 5, 10]
      weights: ['uniform', 'distance']
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: DecisionTreeModel
    requires_graph: false
    optuna_model_args:
      max_depth: [5, 10, 20]
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  # =========================================================================
  # STATSMODELS (Statistical Models)
  # =========================================================================

  - name: ARIMAModel
    requires_graph: false
    n_trials: 5             # Fewer trials since ARIMA is slow (fits per-sample)
    optuna_model_args:
      p: [1, 2, 3]          # AR order
      d: [0, 1, 2]          # Differencing order (3 values → categorical)
      q: [0, 1, 2]          # MA order
      lookback: [16, 32, 48]
    optimizer_params: {}

  - name: SeasonalNaiveModel
    requires_graph: false
    n_trials: 10            # Need enough trials to explore season_length x lookback space
    optuna_model_args:
      season_length: [1, 2, 4, 13, 26, 52]  # 1=naive(last-value), 2=biweekly, 4=monthly, 13=quarterly, 26=biannual, 52=annual
      lookback: [16, 32, 48, 52]             # Need >= season_length for proper seasonal forecast
    optimizer_params: {}

  # =========================================================================
  # COMPARTMENTAL MODELS (Epidemic ODE - fitted per-sample like ARIMA)
  # =========================================================================

  - name: SIRModel
    requires_graph: false
    n_trials: 5
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: SEIRModel
    requires_graph: false
    n_trials: 5
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  # =========================================================================
  # FOUNDATION MODELS (Pretrained - Zero-shot inference, no training required)
  # =========================================================================

  - name: ChronosModel
    requires_graph: false
    model_args:
      model_name: "amazon/chronos-t5-small"
      num_samples: 10
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: MoiraiModel
    requires_graph: false
    model_args:
      model_name: "Salesforce/moirai-1.0-R-small"
      num_samples: 10
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: MomentModel
    requires_graph: false
    model_args:
      model_name: "AutonLab/MOMENT-1-large"
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  - name: TimesFMModel
    requires_graph: false
    model_args:
      model_name: "google/timesfm-2.0-500m-pytorch"
      freq: 1               # 1 = weekly/monthly frequency
    optuna_model_args:
      lookback: [8, 16, 32, 48]
    optimizer_params: {}

  # =========================================================================
  # SPATIOTEMPORAL MODELS (Graph-based)
  # =========================================================================

  - name: STGCN
    requires_graph: true
    optuna_model_args:
      nhids: [32, 48, 64]         # Moderate capacity (too small causes underfitting)
      lookback: [12, 16, 32, 48]  # STGCN requires lookback > 10 (temporal convolutions)
    optimizer_params:
      lr: [0.00003, 0.0001]       # Moderate LR (50x lower than original) to balance stability and learning
      batch_size: [32]
      weight_decay: [0.05, 0.1]   # Moderate regularization (was 0-0.01) - not too aggressive
      epochs: [150]

  # - name: DCRNN
  #   requires_graph: true
  #   optuna_model_args:
  #     rnn_units: [32, 64, 128]    # Fixed: was "nhids" but model param is "rnn_units"
  #     num_rnn_layers: [1, 2, 3]   # 3 values → categorical
  #     lookback: [8, 16, 32, 48]
  #   optimizer_params:
  #     lr: [0.0001, 0.001]
  #     batch_size: [32]
  #     weight_decay: [0, 0.01]
  #     epochs: [150]

  - name: GraphWaveNet
    requires_graph: true
    optuna_model_args:
      residual_channels: [16, 32, 64]   # 3 values → categorical
      dilation_channels: [16, 32, 64]   # 3 values → categorical
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: EpiGNN
    requires_graph: true
    optuna_model_args:
      hidR: [16, 32, 64]
      hidA: [16, 32, 64]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: ColaGNN
    requires_graph: true
    optuna_model_args:
      nhid: [32, 48, 64]         # Moderate capacity (too small causes underfitting)
      n_channels: [2, 3, 4]      # Moderate channels (was [1, 4, 8])
      dropout: [0.3, 0.5]        # Higher dropout for regularization (was [0.1, 0.3, 0.5])
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.0003]       # Moderate LR (10x lower than original, not 100x) to balance stability and learning
      batch_size: [32]
      weight_decay: [0.05, 0.1]  # Moderate regularization (was 0-0.01) - not too aggressive
      epochs: [150]

  - name: ATMGNN
    requires_graph: true
    optuna_model_args:
      nhid: [32, 64, 128]        # 3 values → categorical (was 2 → unintended range)
      dropout: [0.1, 0.3, 0.5]   # Added dropout tuning
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]

  - name: MepoGNN
    requires_graph: true
    optuna_model_args:
      residual_channels: [16, 32, 64]
      dilation_channels: [16, 32, 64]
      lookback: [8, 16, 32, 48]
    optimizer_params:
      lr: [0.0001, 0.001]
      batch_size: [32]
      weight_decay: [0, 0.01]
      epochs: [150]
